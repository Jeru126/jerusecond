<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <header>
        <h1>User Registration</h1>
        <p>Please fill out the form below to create your account.</p>
    </header>

    <main>
        <form action="#" method="post">
    
            <fieldset>
                <legend>Personal Information</legend>
                
                <p>
                    <label for="first-name">First Name:</label><br>
                    <input type="text" id="first-name" name="first-name" placeholder="John" required>
                </p>

                <p>
                    <label for="last-name">Last Name:</label><br>
                    <input type="text" id="last-name" name="last-name" placeholder="Doe" required>
                </p>

                <p>
                    <label for="dob">Date of Birth:</label><br>
                    <input type="date" id="dob" name="dob" required>
                </p>

                <p>
                    <label>Gender:</label><br>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                </p>
            </fieldset>
            <br>
            <fieldset>
                <legend>Account Credentials</legend>
                <p>
                    <label for="username">Username:</label><br>
                    <input type="text" id="username" name="username" required>
                </p>
                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" placeholder="example@email.com" required>
                </p>
                <p>
                    <label for="phone">Phone Number:</label><br>
                    <input type="tel" id="phone" name="phone" placeholder="123-456-7890">
                </p>
                <p>
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" minlength="8" required>
                </p>
                <p>
                    <label for="confirm-password">Confirm Password:</label><br>
                    <input type="password" id="confirm-password" name="confirm-password" minlength="8" required>
                </p>
            </fieldset>
            <br>
            <fieldset>
                <legend>Preferences & Agreements</legend>

                <p>
                    <label for="role">Select Role:</label><br>
                    <select id="role" name="role">
                        <option value="student">Student</option>
                        <option value="athlete">Student-Athlete</option>
                        <option value="instructor">Instructor / Coach</option>
                    </select>
                </p>
                <p>
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the Terms and Conditions.</label>
                </p>
                <p>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Subscribe to updates and newsletters.</label>
                </p>
            </fieldset>
            <br>
            <p>
                <button type="submit">Submit Registration</button>
                <button type="reset">Reset Form</button>
            </p>

        </form>
    </main>

    <footer>
        <p>Already have an account? <a href="login.html">Log in here</a>.</p>
    </footer>

</body>
</html>
