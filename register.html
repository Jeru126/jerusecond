<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Student Portal</title>

    <link rel="stylesheet" href="index.css">
</head>
<body>

    <header>
        <h1>Student Registration</h1>
        <p>Create your account to access the Student Portal</p>

        <nav>
            <a href="home.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="active">Register</a>
        </nav>
    </header>

    <main>
        <section id="about-academics" class="register-container">

            <h2>Create an Account</h2>

            <p>Fill in the information below to register as a student.</p>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required>
                </div>

                <div class="form-group">
                    <label for="studentid">Student ID</label>
                    <input
                        type="text"
                        id="studentid"
                        name="studentid"
                        placeholder="Enter your student ID"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Re-enter your password"
                        minlength="8"
                        required>
                </div>

                <div class="form-group checkbox-group">
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required>
                    <label for="terms">
                        I agree to the terms and conditions.
                    </label>
                </div>

                <button type="submit" class="register-button">
                    Register
                </button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student Portal. All rights reserved.</p>
    </footer>

</body>
</html>
